server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta (/admin, /productos, ...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
